<div class="sidebar__cabecera">
  <span class="sidebar__titulo">Menú</span>
  <button
    type="button"
    class="sidebar__cerrar"
    aria-label="Cerrar menú"
    (click)="cerrar.emit()">
    ×
  </button>
</div>

<nav class="sidebar__nav" aria-label="Navegación principal">
  <a
    class="sidebar__enlace"
    routerLink="/saldo"
    routerLinkActive="activo"
    [attr.title]="plegado() ? 'Saldo' : null"
    (click)="cerrar.emit()">
    <svg class="sidebar__icono" viewBox="0 0 24 24" aria-hidden="true">
      <rect x="3" y="6" width="18" height="13" rx="2" />
      <path d="M3 10h18M16 14.5h2" />
    </svg>
    <span class="sidebar__texto">Saldo</span>
  </a>
  <a
    class="sidebar__enlace"
    routerLink="/historial"
    routerLinkActive="activo"
    [attr.title]="plegado() ? 'Historial' : null"
    (click)="cerrar.emit()">
    <svg class="sidebar__icono" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M8 6h12M8 12h12M8 18h12" />
      <circle cx="4" cy="6" r="1" />
      <circle cx="4" cy="12" r="1" />
      <circle cx="4" cy="18" r="1" />
    </svg>
    <span class="sidebar__texto">Historial</span>
  </a>
</nav>

<button
  type="button"
  class="sidebar__plegar"
  [attr.aria-label]="plegado() ? 'Desplegar menú lateral' : 'Plegar menú lateral'"
  [attr.aria-expanded]="!plegado()"
  (click)="alternarPlegado.emit()">
  <span aria-hidden="true">{{ plegado() ? '»' : '«' }}</span>
  <span class="sidebar__texto">Plegar menú</span>
</button>
