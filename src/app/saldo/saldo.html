<button class="button" (click)="ingreso()"> Ingreso</button>
<button class="button" (click)="gasto()"> Gasto</button>
<button class="button" (click)="getSaldo()"> Ver Saldo</button>

@for (item of movimientos(); track item.id) {
  <p>{{ item.cantidad }} {{ item.tipo }}</p>
} @empty {
  <p>Aún no hay movimientos</p>
}

<br>
<br>

@if(showSaldo){
    <h1> {{saldo()}} </h1>
}
